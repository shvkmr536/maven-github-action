name: maven_s3_artifact

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: List target directory
        run: ls -lrt target

      - name: Create ZIP artifact
        run: |
          mkdir -p release
          zip -j release/my-app-1.0-SNAPSHOT.zip target/my-app-1.0-SNAPSHOT.jar
          ls -l release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload ZIP to S3
        run: |
          aws s3 cp release/my-app-1.0-SNAPSHOT.zip s3://externals-artifacts/artifacts/my-app-1.0-SNAPSHOT.zip

      - name: Verify upload
        run: |
          aws s3 ls s3://externals-artifacts/artifacts/
